name: Validate static PWA

on:
  push:
    branches: [main, pages-main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependency manifest
        run: npm ci
      - name: Run validation and tests
        run: npm test
      - name: Run dependency audit
        run: npm run security
