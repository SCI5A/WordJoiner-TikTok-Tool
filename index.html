<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة منع دمج الكلمات - WordJoiner TikTok Tool</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fe2c55">
    <link rel="icon" href="icons/icon-192x192.png" type="image/png">
</head>
<body>
    <div class="container">
        <header>
            <h1>أداة منع دمج الكلمات</h1>
            <p>امنع دمج الكلمات في TikTok والتطبيقات الأخرى</p>
        </header>

        <main>
            <div class="input-section">
                <label for="inputText">النص الأصلي:</label>
                <textarea id="inputText" placeholder="أدخل أو ألصق النص هنا..."></textarea>
                <div class="stats">
                    عدد الأحرف: <span id="inputCount">0</span>
                </div>
            </div>

            <div class="options-section">
                <label>طريقة المعالجة:</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="joinerType" value="U+2060" checked>
                        <span>Word Joiner (U+2060)</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="joinerType" value="U+200D">
                        <span>Zero Width Joiner (U+200D)</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="joinerType" value="U+200C">
                        <span>Zero Width Non Joiner (U+200C)</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="joinerType" value="U+2009">
                        <span>Thin Space (U+2009)</span>
                    </label>
                </div>
            </div>

            <div class="actions">
                <button id="convertBtn" class="primary-btn">تحويل النص</button>
                <button id="clearBtn" class="secondary-btn">مسح النص</button>
            </div>

            <div class="output-section">
                <label for="outputText">النص الناتج:</label>
                <textarea id="outputText" readonly placeholder="سيظهر النص المعالج هنا..."></textarea>
                <div class="stats">
                    عدد الأحرف: <span id="outputCount">0</span>
                </div>
                <button id="copyBtn" class="copy-btn">نسخ النص</button>
            </div>
        </main>

        <footer>
            <p>WordJoiner TikTok Tool &copy; 2024</p>
        </footer>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed', err));
            });
        }
    </script>
</body>
</html>
